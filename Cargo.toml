[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/spec/guest-proto",
    "crates/spec/executor-proto",
    "crates/spec/executor-repo",
    "crates/spec/executor-install",
    "crates/port/executor",
    "crates/port/image",
    "crates/port/rootfs",
    "crates/port/store",
    "crates/port/events",
    "crates/adapter/oci",
    "crates/adapter/executor-process",
    "crates/core/runtime",
    "crates/core/manage",
    "crates/app/cli",
    "crates/app/shim",
    "crates/app/guest",
    "crates/executor/fake",
    "crates/executor/firecracker",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0 OR MIT"
repository = "https://github.com/toollyst/sandbox"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.dependencies]
# 외부
# 저장소 색인 서명(minisign) 확인. 의존성이 없다.
minisign-verify = "0.3"
# 색인 서명 만들기(xtask repo-sign, 테스트). sbx 바이너리에는 들어가지 않는다.
minisign = { version = "0.10", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI JSON 출력의 JSON Schema 문서(sbx-cli 테스트에서만 만든다).
schemars = "1"
# --jq: jq 식(jaq, Rust 구현). 세 크레이트는 같은 jaq 릴리스에서 함께 올린다.
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = "2.0"
sha2 = "0.11"
flate2 = "1"
# zstd 레이어 풀기. 순수 Rust (C 라이브러리를 묶지 않는다).
ruzstd = "0.9"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = "0.13"
clap = { version = "4", features = ["derive", "env"] }
# 셸 자동완성: 셸이 `COMPLETE=<셸> sbx -- <단어들>`로 sbx를 불러 후보(샌드박스 이름·ID, 이미지 참조)를 받는다.
# `unstable-dynamic`은 semver 밖이라(패치 버전에서도 바뀔 수 있다) 정확한 버전으로 고정한다. 올릴 때는
# crates/app/cli/src/complete.rs와 e2e의 completion 테스트를 다시 확인한다.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
# 터미널 raw 모드와 크기 (CLI의 -t). 키 읽기(events)는 `sbx tui`가 ratatui를 거쳐 켠다.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
# `sbx tui` 화면(전체 화면, crossterm 위). 달력 위젯(time 크레이트)과 매크로는 쓰지 않는다.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }

# workspace
sbx-model = { path = "crates/model" }
sbx-guest-proto = { path = "crates/spec/guest-proto" }
sbx-guest = { path = "crates/app/guest" }
sbx-executor = { path = "crates/port/executor" }
sbx-image = { path = "crates/port/image" }
sbx-rootfs = { path = "crates/port/rootfs" }
sbx-store = { path = "crates/port/store" }
sbx-events = { path = "crates/port/events" }
sbx-runtime = { path = "crates/core/runtime" }
sbx-manage = { path = "crates/core/manage" }
sbx-oci = { path = "crates/adapter/oci" }
sbx-executor-fake = { path = "crates/executor/fake" }
sbx-executor-proto = { path = "crates/spec/executor-proto" }
sbx-executor-process = { path = "crates/adapter/executor-process" }
sbx-executor-install = { path = "crates/spec/executor-install" }
sbx-executor-repo = { path = "crates/spec/executor-repo" }
sbx-shim = { path = "crates/app/shim" }

# 배포 빌드(`cargo xtask dist`, 게스트 init). fat LTO와 codegen-units 1로 한 덩어리로 최적화하고 기호를 지운다:
# macOS arm64 sbx가 16.7 MB → 9.7 MB. 대가는 빌드 시간이다(개발은 debug 빌드를 쓴다).
# panic은 unwind로 둔다: tui가 패닉할 때 Drop으로 자식 프로세스와 터미널을 정리한다.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
