[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0 OR MIT"
repository = "https://github.com/toollyst/sandbox"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.dependencies]
# 외부
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
flate2 = "1"
# zstd 레이어 풀기. 순수 Rust (C 라이브러리를 묶지 않는다).
ruzstd = "0.9"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = "0.13"
clap = { version = "4", features = ["derive", "env"] }
# 터미널 raw 모드와 크기 (CLI의 -t). events 기능은 쓰지 않는다.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

# workspace
sandbox-model = { path = "crates/sandbox-model" }
sandbox-proto = { path = "crates/sandbox-proto" }
sandbox-guest = { path = "crates/sandbox-guest" }
sandbox-executor = { path = "crates/sandbox-executor" }
sandbox-image = { path = "crates/sandbox-image" }
sandbox-rootfs = { path = "crates/sandbox-rootfs" }
sandbox-store = { path = "crates/sandbox-store" }
sandbox-runtime = { path = "crates/sandbox-runtime" }
sandbox-manage = { path = "crates/sandbox-manage" }
sandbox-oci = { path = "crates/sandbox-oci" }
executor-fake = { path = "crates/executor-fake" }
executor-proto = { path = "crates/executor-proto" }
executor-process = { path = "crates/executor-process" }
executor-install = { path = "crates/executor-install" }
executor-repo = { path = "crates/executor-repo" }
sandbox-shim = { path = "crates/sandbox-shim" }
