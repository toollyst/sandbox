# 설치 스크립트 올리기(손으로, main에서): installer.env의 INSTALLER_VERSION을 gh-pages에 install-<버전>.sh와
# install-<버전>.ps1로 한 번 올리고, install.sh·install.ps1을 가장 새 버전의 사본으로 둔다.
#
#   gh workflow run installer.yml
#
# 스크립트의 버전은 sbx와 실행기 버전과 따로 간다. sbx나 기본 실행기가 새로 나왔거나 스크립트를 고쳤으면
# installer.env를 고치고(INSTALLER_VERSION을 올린다) `cargo xtask installer`로 스크립트에 쓴 뒤 main에 넣고 이것을
# 돌린다. 올린 버전은 바꾸지 않는다: 같은 버전에 다른 내용이면 xtask installer가 거부한다(ci.yml도 PR에서 본다).
#
# 1. check: 스크립트가 installer.env와 같다. 이 버전을 아직 올리지 않았거나 같은 내용이다. 고정한 sbx 릴리스의
#    묶음이 GitHub Releases에 있다.
# 2. smoke: KVM이 있는 Linux x86_64 러너에서 이 install.sh를 사용자처럼 돌린다(진짜 릴리스, 고정한 실행기는 공식
#    실행기 저장소에서). 실행기를 고정했으면 `cargo xtask smoke`까지 한다. 고정하지 않았으면 sbx가 깔렸는지와
#    `sbx info`만 본다. GitHub의 macOS 러너는 VM을 띄우지 못하므로 macOS는 올리기 전에 Mac에서 손으로 확인한다.
# 3. publish (environment `installer`: 승인자가 승인해야 돈다, main에서만): gh-pages에 올린다.
#
# 공식 실행기 저장소를 보는 것은 이 워크플로뿐이다. sbx의 CI(ci.yml)와 릴리스(release.yml)는 이것에 기대지 않는다.
name: installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sbx: ${{ steps.pins.outputs.sbx }}
      executor: ${{ steps.pins.outputs.executor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo xtask installer --check
      - name: not published yet, or published with the same content
        run: |
          if git fetch -q --depth=1 origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add -q pages gh-pages
            cargo xtask installer --check-published pages
          fi
      - id: pins
        run: |
          echo "sbx=$(sed -n 's/^SBX=//p' installer.env)" >> "$GITHUB_OUTPUT"
          echo "executor=$(sed -n 's/^EXECUTOR=//p' installer.env)" >> "$GITHUB_OUTPUT"
      - name: the pinned sbx release exists
        env:
          SBX: ${{ steps.pins.outputs.sbx }}
        run: |
          for a in sbx-linux-x86_64.tar.gz sbx-linux-aarch64.tar.gz sbx-darwin-aarch64.tar.gz sbx-windows-x86_64.zip; do
            curl -fsSIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/v$SBX/$a" \
              || { echo "::error::v$SBX has no $a"; exit 1; }
          done

  smoke:
    needs: check
    runs-on: ubuntu-latest
    env:
      SBX: ${{ needs.check.outputs.sbx }}
      EXECUTOR: ${{ needs.check.outputs.executor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm is missing"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: install.sh, the way a user runs it
        run: |
          export SBX_INSTALL_DIR="$RUNNER_TEMP/bin" SBX_DATA_DIR="$RUNNER_TEMP/data" SBX_CACHE_DIR="$RUNNER_TEMP/cache"
          SBX_VERIFY=require sh install.sh
          "$SBX_INSTALL_DIR/sbx" --version | grep -qx "sbx $SBX" || { echo "::error::installed $("$SBX_INSTALL_DIR/sbx" --version), not $SBX"; exit 1; }
          "$SBX_INSTALL_DIR/sbx" info
          if [ -z "$EXECUTOR" ]; then
            echo "::warning::installer.env pins no executor: only sbx was checked"
            exit 0
          fi
          "$SBX_INSTALL_DIR/sbx" executor ls
          "$SBX_INSTALL_DIR/sbx" executor current | grep -q "^$EXECUTOR " || { echo "::error::$EXECUTOR is not the current executor"; exit 1; }
          cargo xtask smoke --sbx "$SBX_INSTALL_DIR/sbx"

  publish:
    needs: [check, smoke]
    runs-on: ubuntu-latest
    environment: installer
    permissions:
      contents: write
    # gh-pages에 push하는 다른 작업(release.yml publish, releases-resign.yml)과 겹치지 않게.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build -q --locked -p xtask
      - name: install-<version>.sh and .ps1, install.sh and .ps1 (gh-pages)
        run: |
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git rm -rfq .)
          fi
          touch pages/.nojekyll
          target/debug/xtask installer --publish pages
          v=$(sed -n 's/^INSTALLER_VERSION=//p' installer.env)
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "gh-pages is unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "installer $v"
          git push origin gh-pages
