# 릴리스: 태그 `v<버전>`(작업 공간 버전과 같아야 한다)을 push하면
#
# 1. sbx (재사용 워크플로 sbx-build.yml, SLSA Build L3): Linux x86_64/aarch64(musl 정적)와 macOS arm64의
#    `sbx-<os>-<arch>.tar.gz`, Windows x86_64의 `sbx-windows-x86_64.zip`(+ 각각 `.sha256`). 실행 파일에는
#    cargo-auditable로 의존성 목록이 들어 있다. 같은 워크플로가 SBOM(SPDX, Cargo.lock 전체)을 만들고, 태그에서는
#    출처 증명(SLSA build provenance)과 SBOM 증명을 sbx-build.yml의 신원으로 만든다.
# 2. smoke: KVM이 있는 Linux x86_64 러너에서, 이 커밋으로 만든 어댑터와 upstream Firecracker VMM 묶음을 로컬 v2
#    저장소(file://)에 두고 1의 sbx로 `sbx executor install firecracker@<FIRECRACKER>`를 한 뒤 `cargo xtask smoke`를
#    통과해야 올린다(ci.yml의 vm과 같다). sbx 릴리스는 wick 릴리스에도 공식 저장소의 내용에도 기대지 않는다.
#    sbx는 VMM 런타임에 묶이지 않는다.
# 3. sign: 각 묶음에 Sigstore 번들(`.sigstore.json`, keyless: 이 워크플로 release.yml의 GitHub OIDC 신원).
# 4. publish (environment `release`: 승인자가 승인해야 돈다, 태그 v*만): GitHub Release에 1과 3의 파일을 올리고,
#    `install.sh`와 `install.ps1`을 gh-pages 맨 위에 둔다.
#    (저장소 설정의 Pages 소스를 gh-pages 브랜치로 해 두어야 https://toollyst.github.io/sandbox/ 로 보인다.)
#
# 실행기(wick VMM 묶음, firecracker 어댑터)는 여기서 만들지 않는다. 공식 실행기 저장소는 따로 있는
# toollyst/sandbox-executors가 이 저장소의 한 커밋에서 어댑터를 만들어 올린다(의존은 그쪽 → 여기 한 방향).
name: release

on:
  push:
    tags: ['v*']
  # 리허설: 아무 브랜치에서나 손으로 돌려 1~3(빌드, smoke, SBOM, Sigstore 서명)을 해 보고, 결과를 작업 산출물로
  # 남긴다. 출처 증명, publish(GitHub Release, gh-pages)는 하지 않는다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          want=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sbx-cli") | .version')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "${GITHUB_REF_NAME}" = "v$want" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version $want"; exit 1; }
            # 릴리스 노트는 CHANGELOG.md의 그 태그 절이다(Breaking·Security를 사람이 쓴다). 없으면 빌드 전에 멈춘다.
            .github/scripts/release-notes.sh "$GITHUB_REF_NAME" >/dev/null
          else
            # 리허설: Unreleased가 있으면 그것, 태그 직전(절 이름을 바꾼 뒤)이면 이 버전의 절.
            .github/scripts/release-notes.sh Unreleased >/dev/null 2>&1 || .github/scripts/release-notes.sh "v$want" >/dev/null
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

  # 빌드와 출처 증명은 재사용 워크플로(sbx-build.yml) 안에서 한다(SLSA Build L3).
  sbx:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sbx-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      attest: ${{ github.event_name == 'push' }}

  smoke:
    needs: [version, sbx]
    runs-on: ubuntu-latest
    env:
      # upstream Firecracker 버전(ci.yml의 vm과 같게 둔다).
      FIRECRACKER: 1.17.0
      ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbx-linux-x86_64
          path: dist
      - run: |
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm is missing"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/kernel/x86_64/kernel
          key: kernel-x86_64-${{ hashFiles('xtask/kernel/*', 'xtask/src/kernel.rs') }}
      - name: adapter (this commit) and VMM package (upstream Firecracker, checked by its sha256)
        run: |
          set -euo pipefail
          cargo build --release -p sbx-executor-firecracker
          [ -f "target/kernel/$ARCH/kernel" ] || cargo xtask kernel --arch "$ARCH"
          mkdir -p adapter
          install -m 755 target/release/sbx-executor-firecracker adapter/sbx-executor
          cp "target/kernel/$ARCH/kernel" adapter/kernel
          .github/scripts/kernel-notice.sh adapter/KERNEL-SOURCE.txt
          WORK="fc" .github/scripts/upstream-vmm.sh "$FIRECRACKER" "$ARCH" vmm
      - name: smoke (the released sbx, installing from a local v2 repository)
        run: |
          tar xzf dist/sbx-linux-x86_64.tar.gz -C dist
          av=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sbx-executor-firecracker") | .version')
          .github/scripts/smoke-local.sh "$PWD/dist/sbx-linux-x86_64/sbx" executors adapter "$av" vmm firecracker "$FIRECRACKER"

  # 서명: 묶음마다 Sigstore 번들. 신원은 이 파일(release.yml@refs/tags/v…)이고 install.sh·install.ps1이 그것을 본다.
  sign:
    needs: [version, sbx, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore 서명(keyless, GitHub OIDC)에 쓴다.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbx-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: artifacts
      # Sigstore 번들(.sigstore.json): gh 없이 cosign verify-blob으로 확인할 수 있게. install.sh가 쓴다.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign (Sigstore keyless)
        run: |
          for f in artifacts/sbx-*/sbx-*.tar.gz artifacts/sbx-*/sbx-*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: release notes (CHANGELOG.md)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then s=$GITHUB_REF_NAME
          elif .github/scripts/release-notes.sh Unreleased >/dev/null 2>&1; then s=Unreleased
          else s=v$VERSION; fi
          .github/scripts/release-notes.sh "$s" > artifacts/release-notes.md
      - if: github.event_name != 'push'
        name: rehearsal output (signed archives, bundles, SBOM)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal
          path: artifacts
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: artifacts

  # 올리기: 태그에서만, 승인이 필요한 environment `release`에서(저장소 설정: 승인자, 태그 v*만).
  publish:
    if: github.event_name == 'push'
    needs: [version, sign]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    # gh-pages에 push하는 것은 이 job 하나다.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: artifacts
      # 서명 도구는 비밀 값이 없는 단계에서 만든다(의존성의 build.rs·proc-macro가 비밀 값을 읽지 못하게).
      - name: build xtask (no secrets)
        run: cargo build -q --locked -p xtask
      # minisign: 묶음마다 .minisig(`sbx upgrade`가 sbx 안의 공개키로 확인한다). 묶음 키는 이 environment에만 있다.
      # 비밀 값이 없으면 건너뛴다(그 릴리스는 `sbx upgrade`와 새 버전 알림에 나오지 않는다).
      - name: minisign archives
        env:
          SBX_RELEASE_SIGNING_KEY: ${{ secrets.SBX_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SBX_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::SBX_RELEASE_SIGNING_KEY is not set: no .minisig files, so sbx upgrade can't install this release"
            exit 0
          fi
          target/debug/xtask sign-files --key-env SBX_RELEASE_SIGNING_KEY artifacts/sbx-*/sbx-*.tar.gz
      - name: release
        run: |
          set -- artifacts/sbx-*/sbx-*.tar.gz.minisig
          [ -e "$1" ] || set --
          gh release create "$GITHUB_REF_NAME" --title "sbx $VERSION" --notes-file artifacts/release-notes.md --generate-notes \
            artifacts/sbx-*/sbx-*.tar.gz artifacts/sbx-*/sbx-*.tar.gz.sha256 artifacts/sbx-*/sbx-*.tar.gz.sigstore.json \
            artifacts/sbx-*/sbx-*.zip artifacts/sbx-*/sbx-*.zip.sha256 artifacts/sbx-*/sbx-*.zip.sigstore.json \
            "artifacts/sbx-$VERSION.spdx.json" "$@"
      # gh-pages: 설치 스크립트와 sbx 릴리스 색인(releases.json, 색인 키로 서명). 색인은 묶음이 서명됐을 때만 더한다.
      # 있던 releases.json은 색인 키로 서명된 것이어야 한다(xtask가 확인한다). 보안 고침 표시(`security`)는 이 태그의
      # CHANGELOG 절의 `### Security` 아래가 GHSA나 CVE를 말할 때다(강화만 적은 Security 절은 아니다).
      - name: install.sh, install.ps1 and releases.json (gh-pages)
        env:
          SBX_RELEASE_INDEX_KEY: ${{ secrets.SBX_RELEASE_INDEX_KEY }}
        run: |
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git rm -rfq .)
          fi
          cp install.sh install.ps1 pages/
          touch pages/.nojekyll
          set -- artifacts/sbx-*/sbx-*.tar.gz.minisig
          if [ -z "$SBX_RELEASE_INDEX_KEY" ] || [ ! -e "$1" ]; then
            echo "::warning::SBX_RELEASE_INDEX_KEY is not set or the archives are not signed: releases.json is unchanged"
          else
            security=
            if awk '/^### /{on=($0=="### Security")} on' artifacts/release-notes.md | grep -Eq 'GHSA-|CVE-'; then
              security=--security
            fi
            target/debug/xtask release-index --index pages/releases.json --version "$VERSION" --assets artifacts \
              --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" $security \
              --key-env SBX_RELEASE_INDEX_KEY
          fi
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "gh-pages is unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "release $GITHUB_REF_NAME"
          git push origin gh-pages
