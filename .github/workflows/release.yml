# 릴리스: 태그 `v<버전>`(작업 공간 버전과 같아야 한다)을 push하면
#
# 1. sbx: Linux x86_64/aarch64(musl 정적)와 macOS arm64의 `sbx-<os>-<arch>.tar.gz`(+ `.sha256`)
# 2. smoke: KVM이 있는 Linux x86_64 러너에서, 이 커밋으로 만든 어댑터와 upstream Firecracker VMM 묶음을 로컬 v2
#    저장소(file://)에 두고 1의 sbx로 `sbx executor install firecracker@<FIRECRACKER>`를 한 뒤 `cargo xtask smoke`를
#    통과해야 올린다(ci.yml의 vm과 같다). sbx 릴리스는 wick 릴리스에도 공식 저장소의 내용에도 기대지 않는다.
#    sbx는 VMM 런타임에 묶이지 않고, 실행기는 따로 executors.yml로 올린다.
# 3. 서명: 각 묶음에 Sigstore 번들(`.sigstore.json`, keyless: 이 워크플로의 GitHub OIDC 신원), GitHub 출처 증명
#    (SLSA build provenance)과 SBOM(SPDX, Cargo.lock 전체) 증명을 만든다.
# 4. GitHub Release에 1과 3의 파일을 올리고, `install.sh`를 gh-pages 맨 위에 둔다.
#    (저장소 설정의 Pages 소스를 gh-pages 브랜치로 해 두어야 https://toollyst.github.io/sandbox/ 로 보인다.)
#
# 실행기(wick VMM 묶음, firecracker 어댑터)는 여기서 만들지 않는다. executors.yml(손으로 돌린다)이 만들어
# gh-pages의 `executors/v2/index.json`에 올린다. sbx 0.1.x가 읽는 schema 1 `executors/index.json`은 그대로 남고
# 더는 바뀌지 않는다.
name: release

on:
  push:
    tags: ['v*']
  # 리허설: 아무 브랜치에서나 손으로 돌려 1~3(빌드, smoke, SBOM, Sigstore 서명)을 해 보고, 결과를 작업 산출물로
  # 남긴다. GitHub Release, 출처 증명, gh-pages는 건드리지 않는다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          want=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sbx-cli") | .version')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "${GITHUB_REF_NAME}" = "v$want" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version $want"; exit 1; }
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

  sbx:
    needs: version
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-musl }
          - { os: macos-15, platform: darwin-aarch64, target: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build
        run: |
          arch=$(uname -m | sed s/arm64/aarch64/)
          rustup target add "$arch-unknown-linux-musl"
          if [ -n "${{ matrix.target }}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
            cargo xtask dist --target "${{ matrix.target }}"
            out="target/${{ matrix.target }}/release"
          else
            cargo xtask dist
            out=target/release
          fi
          d="sbx-${{ matrix.platform }}"
          mkdir -p "dist/$d"
          cp "$out/sbx" "$out/sbx-shim" LICENSE-APACHE LICENSE-MIT README.md "dist/$d/"
          "dist/$d/sbx" --version
          tar -czf "dist/$d.tar.gz" -C dist "$d"
          (cd dist && shasum -a 256 "$d.tar.gz" > "$d.tar.gz.sha256" && cat "$d.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbx-${{ matrix.platform }}
          path: dist/sbx-${{ matrix.platform }}.tar.gz*

  smoke:
    needs: [version, sbx]
    runs-on: ubuntu-latest
    env:
      # upstream Firecracker 버전(ci.yml의 vm과 같게 둔다).
      FIRECRACKER: 1.17.0
      ARCH: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbx-linux-x86_64
          path: dist
      - run: |
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm is missing"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/kernel/x86_64/kernel
          key: kernel-x86_64-${{ hashFiles('xtask/kernel/*', 'xtask/src/kernel.rs') }}
      - name: adapter (this commit) and VMM package (upstream Firecracker, checked by its sha256)
        run: |
          set -euo pipefail
          cargo build --release -p sbx-executor-firecracker
          [ -f "target/kernel/$ARCH/kernel" ] || cargo xtask kernel --arch "$ARCH"
          mkdir -p adapter
          install -m 755 target/release/sbx-executor-firecracker adapter/sbx-executor
          cp "target/kernel/$ARCH/kernel" adapter/kernel
          .github/scripts/kernel-notice.sh adapter/KERNEL-SOURCE.txt
          WORK=fc .github/scripts/upstream-vmm.sh "$FIRECRACKER" "$ARCH" vmm
      - name: smoke (the released sbx, installing from a local v2 repository)
        run: |
          tar xzf dist/sbx-linux-x86_64.tar.gz -C dist
          av=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sbx-executor-firecracker") | .version')
          .github/scripts/smoke-local.sh "$PWD/dist/sbx-linux-x86_64/sbx" executors adapter "$av" vmm firecracker "$FIRECRACKER"

  publish:
    needs: [version, sbx, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore 서명(keyless, GitHub OIDC)과 GitHub 출처 증명(attestation)에 쓴다.
      id-token: write
      attestations: write
    # executors.yml도 gh-pages에 push한다.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sbx-*
          path: artifacts
      # SBOM: Cargo.lock의 의존성 전부(SPDX JSON). 릴리스에 올리고 각 묶음에 증명으로도 붙인다.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: artifacts/sbx-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # 출처 증명(SLSA build provenance)과 SBOM 증명. `gh attestation verify <file> -R toollyst/sandbox`로 확인한다.
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/sbx-*/sbx-*.tar.gz
      - if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: artifacts/sbx-*/sbx-*.tar.gz
          sbom-path: artifacts/sbx-${{ needs.version.outputs.version }}.spdx.json
      # Sigstore 번들(.sigstore.json): gh 없이 cosign verify-blob으로 확인할 수 있게. install.sh가 쓴다.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign (Sigstore keyless)
        run: |
          for f in artifacts/sbx-*/sbx-*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - if: github.event_name != 'push'
        name: rehearsal output (signed archives, bundles, SBOM)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal
          path: artifacts
      - if: github.event_name == 'push'
        name: release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "sbx $VERSION" --generate-notes \
            artifacts/sbx-*/sbx-*.tar.gz artifacts/sbx-*/sbx-*.tar.gz.sha256 artifacts/sbx-*/sbx-*.tar.gz.sigstore.json \
            "artifacts/sbx-$VERSION.spdx.json"
      - if: github.event_name == 'push'
        name: install.sh (gh-pages)
        run: |
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git rm -rfq .)
          fi
          cp install.sh pages/install.sh
          touch pages/.nojekyll
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "install.sh is unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "release $GITHUB_REF_NAME"
          git push origin gh-pages
