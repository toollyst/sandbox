# OpenSSF Scorecard: 저장소의 공급망 습관(고정한 Actions, 토큰 권한, 서명한 릴리스, 퍼징, 보안 정책 등)을 점수로
# 매겨 공개하고(https://scorecard.dev/viewer/?uri=github.com/toollyst/sandbox), 결과를 Security 탭의 코드 스캔에
# 올린다. main에 push할 때와 손으로 돌릴 때만.
name: scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard
          path: results.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
