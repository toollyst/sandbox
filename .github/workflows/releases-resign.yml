# sbx 릴리스 색인(gh-pages의 releases.json)을 다시 서명한다. 색인의 기한(expires)은 30일이고 이 작업이 매주 늘린다.
# 손으로 돌리면 버전을 거두거나(yank) 되돌리거나 알림을 단다.
#
# 서명 키는 environment `release-index`(승인 없음, main에서만)의 SBX_RELEASE_INDEX_KEY다. 묶음을 서명하는 키는
# 여기 없다(`release`에만): 이 키가 새도 가짜 알림은 만들 수 있지만 `sbx upgrade`가 설치할 묶음은 못 만든다.
# 키가 없거나 releases.json이 아직 없으면 아무것도 하지 않는다.
name: releases-resign

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      yank:
        description: version to yank, e.g. 0.2.2 (empty = only re-sign)
        required: false
        type: string
      advisory:
        description: one-line advisory for that version (optional)
        required: false
        type: string
      undo:
        description: un-yank the version instead
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  resign:
    runs-on: ubuntu-latest
    environment: release-index
    permissions:
      contents: write
    # gh-pages에 push하는 다른 작업(release.yml publish)과 겹치지 않게.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      SBX_RELEASE_INDEX_KEY: ${{ secrets.SBX_RELEASE_INDEX_KEY }}
      YANK: ${{ inputs.yank }}
      ADVISORY: ${{ inputs.advisory }}
      UNDO: ${{ inputs.undo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: re-sign releases.json
        run: |
          if [ -z "$SBX_RELEASE_INDEX_KEY" ]; then
            echo "::warning::SBX_RELEASE_INDEX_KEY is not set: nothing to sign"
            exit 0
          fi
          if ! git fetch origin gh-pages:gh-pages 2>/dev/null; then echo "no gh-pages branch yet"; exit 0; fi
          git worktree add pages gh-pages
          if [ ! -f pages/releases.json ]; then echo "no releases.json yet"; exit 0; fi
          if [ -n "$YANK" ]; then
            set -- --index pages/releases.json --version "$YANK"
            if [ -n "$ADVISORY" ]; then set -- "$@" --advisory "$ADVISORY"; fi
            if [ "$UNDO" = true ]; then set -- "$@" --undo; fi
            cargo xtask release-yank "$@"
          fi
          cargo xtask release-sign --index pages/releases.json --key-env SBX_RELEASE_INDEX_KEY
          cd pages
          git add releases.json releases.json.minisig
          msg="re-sign releases.json"
          if [ -n "$YANK" ]; then msg="releases.json: yank $YANK (undo=$UNDO)"; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "$msg"
          git push origin gh-pages
