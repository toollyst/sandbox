# sbx 릴리스 색인(gh-pages의 releases.json)을 다시 서명한다. 색인의 기한(expires)은 30일이고 이 작업이 매주 늘린다.
# 내용은 바꾸지 않는다: 있던 파일이 색인 키로 서명된 것이 아니면 서명하지 않는다(xtask release-sign이 확인한다).
# 그래서 gh-pages에 push할 수 있는 누군가가 releases.json을 고쳐도 이 작업이 그것을 서명해 주지 않는다.
#
# 서명 키는 environment `release-index`(승인 없음, main에서만)의 SBX_RELEASE_INDEX_KEY다. 묶음을 서명하는 키는
# 여기 없다(`release`에만). 버전을 거두는 것은 메인테이너가 오프라인 키로 한다(docs/developers/testing-and-releasing.md).
# 키가 없거나 releases.json이 아직 없으면 아무것도 하지 않는다.
name: releases-resign

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resign:
    runs-on: ubuntu-latest
    environment: release-index
    permissions:
      contents: write
    # gh-pages에 push하는 다른 작업(release.yml publish)과 겹치지 않게.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 서명 도구는 비밀 값이 없는 단계에서 만든다(의존성의 build.rs·proc-macro가 비밀 값을 읽지 못하게).
      - name: build xtask (no secrets)
        run: cargo build -q --locked -p xtask
      - name: re-sign releases.json
        env:
          SBX_RELEASE_INDEX_KEY: ${{ secrets.SBX_RELEASE_INDEX_KEY }}
        run: |
          if [ -z "$SBX_RELEASE_INDEX_KEY" ]; then
            echo "::warning::SBX_RELEASE_INDEX_KEY is not set: nothing to sign"
            exit 0
          fi
          if ! git fetch origin gh-pages:gh-pages 2>/dev/null; then echo "no gh-pages branch yet"; exit 0; fi
          git worktree add pages gh-pages
          if [ ! -f pages/releases.json ]; then echo "no releases.json yet"; exit 0; fi
          target/debug/xtask release-sign --index pages/releases.json --key-env SBX_RELEASE_INDEX_KEY
          cd pages
          git add releases.json releases.json.minisig
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "re-sign releases.json"
          git push origin gh-pages
