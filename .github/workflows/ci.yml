name: ci

on:
  push:
    # 작업 브랜치(feat/**)도 PR 없이 실제 VM까지 돌려 본다.
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 의존성: RustSec 보안 권고(알려진 취약점, 회수된 크레이트), 라이선스, 출처(crates.io만). 규칙은 deny.toml.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # PR의 커밋마다 Signed-off-by(DCO)가 있어야 한다(CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line (git commit -s)"
              bad=1
            fi
          done
          exit $bad

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      # install.sh의 확인 분기(체크섬, SBX_VERIFY, 서명): 가짜 릴리스와 가짜 cosign으로.
      - if: runner.os != 'Windows'
        run: .github/scripts/test-install.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Linux에서는 erofs와 ext2 공식 검사기로 만든 이미지를 검증한다. 도구가 없으면 테스트가 실패한다.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils e2fsprogs
          echo "SANDBOX_REQUIRE_FSCK_EROFS=1" >> "$GITHUB_ENV"
          echo "SANDBOX_REQUIRE_E2FSCK=1" >> "$GITHUB_ENV"
      # 실패해도 다른 크레이트의 테스트를 계속 돌려 실패를 한 번에 다 본다.
      - run: cargo test --workspace --all-features --no-fail-fast
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo xtask check-deps
      # install.ps1의 확인 분기: 가짜 릴리스(진짜 sbx.exe를 담은 zip)와 가짜 cosign으로.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p sbx-cli -p sbx-shim
          ./.github/scripts/test-install.ps1
          ./.github/scripts/test-install.ps1 -Shell powershell.exe
      - if: runner.os == 'Linux'
        run: shellcheck install.sh .github/scripts/*.sh
      # 게스트 init initramfs. 두 아키텍처 모두 어느 호스트에서나 rust-lld로 링크된다.
      # 호스트 아키텍처의 것을 내장한 sbx로 e2e를 다시 돌리고(내장한 init을 캐시로 꺼내는지), 배포 빌드를 만든다.
      - if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo xtask guest-initramfs --arch x86_64
          cargo xtask guest-initramfs --arch aarch64
          SBX_EMBED_GUEST="$PWD/target/guest/$(uname -m)/initramfs" cargo test -p sbx-cli --test e2e
          cargo xtask dist

  # root와 loop 장치가 필요한 테스트 (커널이 scratch를 마운트하고 overlay upper로 쓰는지).
  privileged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          docker run --rm --privileged -v "$PWD":/src -w /src \
            -e SANDBOX_PRIVILEGED_TESTS=1 -e SANDBOX_REQUIRE_E2FSCK=1 rust:1 bash -ec '
              apt-get update -qq && apt-get install -y -qq e2fsprogs
              cargo test -p sbx-guest --lib privileged -- --nocapture'

  # 실제 VM: 사용자가 받는 것과 같은 v2 경로. 이 커밋의 어댑터(sbx-executor-firecracker + `cargo xtask kernel`로 만든
  # 커널)와 upstream Firecracker VMM 묶음으로 로컬 v2 저장소(file://)를 만들고, install.sh로 설치한 sbx로
  # `sbx executor install firecracker@<FIRECRACKER>`를 한 뒤 smoke와 bench를 돌린다(.github/scripts/smoke-local.sh,
  # release.yml이 올리기 전에, toollyst/sandbox-executors가 올리기 전에 하는 것과 같다). wick에도 공식 저장소에도
  # 기대지 않는다.
  # x86_64 러너에는 /dev/kvm이 있어야 한다. arm 러너에 없으면 건너뛰고 알린다.
  vm:
    name: vm (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            require_kvm: true
          - os: ubuntu-24.04-arm
            arch: aarch64
            require_kvm: false
    runs-on: ${{ matrix.os }}
    env:
      # upstream Firecracker 버전. 로컬 저장소에는 firecracker@<이 버전>으로 올린다.
      FIRECRACKER: 1.17.0
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.require_kvm }}" = true ]; then
            echo "::error::/dev/kvm is missing on ${{ matrix.os }}"; exit 1
          else
            echo "::notice::/dev/kvm is missing on ${{ matrix.os }}; skipping the real-VM run"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.kvm.outputs.ok == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/kernel/${{ matrix.arch }}/kernel
          key: kernel-${{ matrix.arch }}-${{ hashFiles('xtask/kernel/*', 'xtask/src/kernel.rs') }}
      - if: steps.kvm.outputs.ok == 'true'
        name: build sbx, the adapter and the kernel
        run: |
          rustup target add "$ARCH-unknown-linux-musl"
          cargo xtask dist
          cargo build --release -p sbx-executor-firecracker
          [ -f "target/kernel/$ARCH/kernel" ] || cargo xtask kernel --arch "$ARCH"
      - if: steps.kvm.outputs.ok == 'true'
        name: adapter bundle and VMM package (upstream Firecracker release, checked by its sha256)
        run: |
          set -euo pipefail
          mkdir -p adapter
          install -m 755 target/release/sbx-executor-firecracker adapter/sbx-executor
          cp "target/kernel/$ARCH/kernel" adapter/kernel
          .github/scripts/kernel-notice.sh adapter/KERNEL-SOURCE.txt
          WORK="fc" .github/scripts/upstream-vmm.sh "$FIRECRACKER" "$ARCH" vmm
          vmm/firecracker --version
      - if: steps.kvm.outputs.ok == 'true'
        name: install.sh (from a local copy of the release files)
        run: |
          d="sbx-linux-$ARCH"
          mkdir -p "rel/$d"
          cp target/release/sbx target/release/sbx-shim "rel/$d/"
          tar -czf "rel/$d.tar.gz" -C rel "$d"
          (cd rel && sha256sum "$d.tar.gz" > "$d.tar.gz.sha256")
          SBX_DOWNLOAD_URL="file://$PWD/rel" SBX_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
      - if: steps.kvm.outputs.ok == 'true'
        name: install upstream Firecracker from a local v2 repository, then smoke
        run: |
          av=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sbx-executor-firecracker") | .version')
          .github/scripts/smoke-local.sh "$RUNNER_TEMP/bin/sbx" executors adapter "$av" vmm firecracker "$FIRECRACKER"
      - if: steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executors-linux-${{ matrix.arch }}
          path: executors
      - if: steps.kvm.outputs.ok == 'true'
        name: bench
        run: |
          { echo "### $ARCH, firecracker@$FIRECRACKER (upstream Firecracker v$FIRECRACKER, KVM)"; cargo xtask bench --runs 20 --parallel 8; } >> "$GITHUB_STEP_SUMMARY"
