name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Linux에서는 erofs 공식 도구로 만든 이미지를 검증한다. 도구가 없으면 테스트가 실패한다.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
          echo "SANDBOX_REQUIRE_FSCK_EROFS=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo xtask check-deps

  # 실제 VM 부팅이 가능한 러너인지 확인한다. 결과는 기록만 하고 실패시키지 않는다.
  kvm-probe:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm present on ${{ matrix.os }}"
            ls -l /dev/kvm
          else
            echo "/dev/kvm absent on ${{ matrix.os }}"
          fi
