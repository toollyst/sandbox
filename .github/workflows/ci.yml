name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Linux에서는 erofs와 ext2 공식 검사기로 만든 이미지를 검증한다. 도구가 없으면 테스트가 실패한다.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils e2fsprogs
          echo "SANDBOX_REQUIRE_FSCK_EROFS=1" >> "$GITHUB_ENV"
          echo "SANDBOX_REQUIRE_E2FSCK=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo xtask check-deps
      # 게스트 init initramfs. 두 아키텍처 모두 어느 호스트에서나 rust-lld로 링크된다.
      # 호스트 아키텍처의 것을 내장한 sbx로 e2e를 다시 돌리고(내장한 init을 캐시로 꺼내는지), 배포 빌드를 만든다.
      - if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo xtask guest-initramfs --arch x86_64
          cargo xtask guest-initramfs --arch aarch64
          SBX_EMBED_GUEST="$PWD/target/guest/$(uname -m)/initramfs" cargo test -p sandbox-cli --test e2e
          cargo xtask dist

  # root와 loop 장치가 필요한 테스트 (커널이 scratch를 마운트하고 overlay upper로 쓰는지).
  privileged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm --privileged -v "$PWD":/src -w /src \
            -e SANDBOX_PRIVILEGED_TESTS=1 -e SANDBOX_REQUIRE_E2FSCK=1 rust:1 bash -ec '
              apt-get update -qq && apt-get install -y -qq e2fsprogs
              cargo test -p sandbox-guest --lib privileged -- --nocapture'

  # 실제 VM: upstream Firecracker(KVM) + executor-firecracker + `cargo xtask kernel`로 만든 커널.
  # x86_64 러너에는 /dev/kvm이 있어야 한다. arm 러너에 없으면 건너뛰고 알린다.
  vm:
    name: vm (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            require_kvm: true
          - os: ubuntu-24.04-arm
            arch: aarch64
            require_kvm: false
    runs-on: ${{ matrix.os }}
    env:
      FIRECRACKER: v1.17.0
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.require_kvm }}" = true ]; then
            echo "::error::/dev/kvm is missing on ${{ matrix.os }}"; exit 1
          else
            echo "::notice::/dev/kvm is missing on ${{ matrix.os }}; skipping the real-VM run"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.kvm.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: target/kernel/${{ matrix.arch }}/kernel
          key: kernel-${{ matrix.arch }}-${{ hashFiles('xtask/kernel/*', 'xtask/src/kernel.rs') }}
      - if: steps.kvm.outputs.ok == 'true'
        name: build sbx, the adapter and the kernel
        run: |
          rustup target add "$ARCH-unknown-linux-musl"
          cargo xtask dist
          cargo build --release -p executor-firecracker
          [ -f "target/kernel/$ARCH/kernel" ] || cargo xtask kernel --arch "$ARCH"
      - if: steps.kvm.outputs.ok == 'true'
        name: executor bundle (upstream Firecracker release, checked by its sha256)
        run: |
          mkdir -p fc bundle && cd fc
          base="https://github.com/firecracker-microvm/firecracker/releases/download/$FIRECRACKER"
          curl -fsSLO "$base/firecracker-$FIRECRACKER-$ARCH.tgz"
          curl -fsSLO "$base/firecracker-$FIRECRACKER-$ARCH.tgz.sha256.txt"
          sha256sum -c "firecracker-$FIRECRACKER-$ARCH.tgz.sha256.txt"
          tar xzf "firecracker-$FIRECRACKER-$ARCH.tgz"
          cd ..
          cp "fc/release-$FIRECRACKER-$ARCH/firecracker-$FIRECRACKER-$ARCH" bundle/firecracker
          cp target/release/sbx-executor-firecracker bundle/sbx-executor
          cp "target/kernel/$ARCH/kernel" bundle/kernel
      - if: steps.kvm.outputs.ok == 'true'
        name: publish the bundle to a repository and install it from there
        run: |
          cargo xtask repo-add --repo executors --bundle bundle --name firecracker --version "${FIRECRACKER#v}-ci"
          target/release/sbx executor repo add ci "file://$PWD/executors"
          target/release/sbx executor install firecracker
      - if: steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: executors-linux-${{ matrix.arch }}
          path: executors
      - if: steps.kvm.outputs.ok == 'true'
        name: smoke and bench
        run: |
          cargo xtask smoke
          { echo "### $ARCH, Firecracker $FIRECRACKER (KVM)"; cargo xtask bench --runs 20 --parallel 8; } >> "$GITHUB_STEP_SUMMARY"
