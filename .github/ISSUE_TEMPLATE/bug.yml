name: Bug report
description: Something doesn't work as documented, or differs from Docker without being listed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got (paste the output).
      render: console
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: sbx info
      description: Output of `sbx info` (version, host, hypervisor, executor and directories).
      render: console
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
      description: e.g. Apple M2, AMD EPYC 7763, or "GitHub Actions ubuntu-latest".
  - type: markdown
    attributes:
      value: Security problems go through private reporting (see SECURITY.md), not here.
