[package]
name = "sbx-manage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 퍼징(fuzz/)에 레이어 tar 읽기와 zstd 풀기를 연다. 배포하는 바이너리는 켜지 않는다(cargo xtask check-deps).
fuzzing = []

[dependencies]
sbx-model.workspace = true
flate2.workspace = true
ruzstd.workspace = true
tar.workspace = true
# `sbx save`: OCI layout의 index.json, 받은 문서의 정보.
serde_json.workspace = true
sbx-image.workspace = true
# 빌드가 만든 층은 blob 없이 층 디스크만 있다. 합칠 때 그 디스크를 다시 읽는다(erofs::read).
sbx-rootfs = { workspace = true, features = ["erofs"] }
sbx-store = { workspace = true, features = ["write"] }
sbx-events.workspace = true
