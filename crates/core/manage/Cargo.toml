[lints]
workspace = true

[features]
# 퍼징(fuzz/)에 레이어 tar 읽기와 zstd 풀기를 연다. 배포하는 바이너리는 켜지 않는다(cargo xtask check-deps).
fuzzing = []

[dependencies]
sbx-model.workspace = true
flate2.workspace = true
ruzstd.workspace = true
tar.workspace = true
# `sbx save`: OCI layout의 index.json, 받은 문서의 정보.
serde_json.workspace = true
sbx-image.workspace = true
sbx-rootfs.workspace = true
sbx-store = { workspace = true, features = ["write"] }
sbx-events.workspace = true
