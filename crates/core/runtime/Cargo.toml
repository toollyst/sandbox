[package]
name = "sbx-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 퍼징(fuzz/)에 `hostfs`(게스트가 보낸 파일 받기)를 연다. 배포하는 바이너리는 켜지 않는다(cargo xtask check-deps).
fuzzing = []

[dependencies]
sbx-model.workspace = true
serde.workspace = true
serde_json.workspace = true
sbx-guest-proto.workspace = true
sbx-executor.workspace = true
# write feature를 켜지 않는다. 실행 쪽은 캐시를 읽기만 한다.
sbx-store.workspace = true
sbx-events.workspace = true

[dev-dependencies]
sbx-executor-fake.workspace = true
# 빌드 층 테스트: 내보낸 tar를 다른 구현(tar 크레이트)으로 읽어 rootfs 병합에 넣는다. 관리 쪽(sbx-manage)은
# 쓰지 않는다: 캐시 쓰기 feature를 켜게 되기 때문이다(cargo xtask check-deps).
tar.workspace = true
sbx-rootfs.workspace = true

# macOS의 fsync(2) (records::sync). std의 sync_all은 F_FULLFSYNC다.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

# socket_dir의 소유자 확인 (geteuid).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }
# 복사해 넣는 파일을 O_NOFOLLOW로 연다 (hostfs).
libc.workspace = true
