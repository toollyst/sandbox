[package]
name = "sandbox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "sbx"
path = "src/main.rs"

[dependencies]
sandbox-model.workspace = true
sandbox-executor.workspace = true
sandbox-image.workspace = true
sandbox-store.workspace = true
sandbox-proto.workspace = true
clap.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["signal", "time", "net", "io-util", "io-std", "sync"] }
serde_json.workspace = true
sandbox-runtime.workspace = true
sandbox-shim.workspace = true
sandbox-manage.workspace = true
sandbox-oci.workspace = true
sandbox-rootfs = { workspace = true, features = ["erofs"] }
executor-process.workspace = true
executor-install.workspace = true
executor-repo.workspace = true
executor-proto.workspace = true
# mcp: read_file/write_file의 바이너리 내용.
base64 = "0.23"

[dev-dependencies]
# 테스트 실행 파일이 곧 가짜 실행기다(tests/e2e.rs).
executor-fake.workspace = true
sandbox-store = { workspace = true, features = ["write"] }
# 실행기 저장소 테스트에서 묶음 압축 파일과 색인을 만든다.
tar.workspace = true
flate2.workspace = true
sha2.workspace = true
serde_json.workspace = true

[[test]]
name = "e2e"
harness = false
