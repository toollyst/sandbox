<text class="a0" x="0" y="14.0" textLength="260.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run --rm alpine uname -sr</text><rect class="t0" x="16.8" y="0.0" width="252.0" height="20" fill="#1d1f27"/><text class="a1" x="0" y="34.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">Linux 6.1.155</text><text class="a2" x="0" y="54.0" textLength="260.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>time sbx run --rm alpine true</text><rect class="t2" x="16.8" y="40.0" width="252.0" height="20" fill="#1d1f27"/><text class="a3" x="0" y="74.0" textLength="92.4" lengthAdjust="spacingAndGlyphs">real 0.176s</text><text class="a4" x="0" y="94.0" textLength="588.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run --rm alpine ls /sys/class/net   <tspan class="c">  # no network device at all</tspan></text><rect class="t4" x="16.8" y="80.0" width="579.6" height="20" fill="#1d1f27"/><text class="a5" x="0" y="114.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">lo</text><text class="a6" x="0" y="134.0" textLength="840.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run --rm --network allow --allow example.com:443 curlimages/curl -s https://example.com | grep</text><rect class="t6" x="16.8" y="120.0" width="831.6" height="20" fill="#1d1f27"/><text class="a7" x="0" y="154.0" textLength="193.2" lengthAdjust="spacingAndGlyphs"> -o '&lt;title&gt;.*&lt;/title&gt;'</text><rect class="t7" x="0.0" y="140.0" width="201.6" height="20" fill="#1d1f27"/><text class="a8" x="0" y="174.0" textLength="243.6" lengthAdjust="spacingAndGlyphs">&lt;title&gt;Example Domain&lt;/title&gt;</text><text class="a9" x="0" y="194.0" textLength="781.2" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run --rm --network allow --allow example.com:443 curlimages/curl -sS https://github.com</text><rect class="t9" x="16.8" y="180.0" width="772.8" height="20" fill="#1d1f27"/><text class="a10" x="0" y="214.0" textLength="378.0" leng