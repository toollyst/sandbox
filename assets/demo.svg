<text class="a0" x="0" y="14.0" textLength="688.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run --rm alpine:3.20 uname -sr        <tspan class="c">  # every sandbox boots its own kernel</tspan></text><rect class="t0" x="16.8" y="0.0" width="680.4" height="20" fill="#1d1f27"/><text class="a1" x="0" y="34.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">Linux 6.1.155</text><text class="a2" x="0" y="54.0" textLength="134.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>cat Dockerfile</text><rect class="t2" x="16.8" y="40.0" width="126.0" height="20" fill="#1d1f27"/><text class="a3" x="0" y="74.0" textLength="134.4" lengthAdjust="spacingAndGlyphs">FROM alpine:3.20</text><text class="a4" x="0" y="94.0" textLength="352.8" lengthAdjust="spacingAndGlyphs">RUN apk add --no-cache postgresql16-client</text><text class="a5" x="0" y="114.0" textLength="243.6" lengthAdjust="spacingAndGlyphs">ENV PGHOST=db PGUSER=postgres</text><text class="a6" x="0" y="134.0" textLength="798.0" lengthAdjust="spacingAndGlyphs">CMD until psql -c 'select 1' &gt;/dev/null 2&gt;&amp;1; do sleep 1; done; psql -tAc 'show server_version'</text><text class="a7" x="0" y="154.0" textLength="722.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx build -t app .                        <tspan class="c">  # RUN has no network unless you allow it</tspan></text><rect class="t7" x="16.8" y="140.0" width="714.0" height="20" fill="#1d1f27"/><text class="a8" x="0" y="174.0" textLength="184.8" lengthAdjust="spacingAndGlyphs">[1/4] FROM alpine:3.20</text><text class="a9" x="0" y="194.0" textLength="126.0" lengthAdjust="spacingAndGlyphs">[1/4] DONE 0.0s</text><text class="a10" x="0" y="214.0" textLength="403.2" lengthAdjust="spacingAndGlyphs">[2/4] RUN apk add --no-cache postgresql16-client</text><text class="a11" x="0" y="234.0" textLength="655.2" lengthAdjust="spacingAndGlyphs">fetch https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/APKINDEX.tar.gz</text><text class="a12" x="0" y="254.0" textLength="697.2" lengthAdjust="spacingAndGlyphs">fetch https://dl-cdn.alpinelinux.org/alpine/v3.20/community/aarch64/APKINDEX.tar.gz</text><text class="a13" x="0" y="274.0" textLength="705.6" lengthAdjust="spacingAndGlyphs">WARNING: fetching https://dl-cdn.alpinelinux.org/alpine/v3.20/main: DNS lookup error</text><text class="a14" x="0" y="294.0" textLength="747.6" lengthAdjust="spacingAndGlyphs">WARNING: fetching https://dl-cdn.alpinelinux.org/alpine/v3.20/community: DNS lookup error</text><text class="a15" x="0" y="314.0" textLength="277.2" lengthAdjust="spacingAndGlyphs">ERROR: unable to select packages:</text><text class="a16" x="0" y="334.0" textLength="336.0" lengthAdjust="spacingAndGlyphs">  postgresql16-client (no such package):</text><text class="a17" x="0" y="354.0" textLength="361.2" lengthAdjust="spacingAndGlyphs">    required by: world[postgresql16-client]</text><text class="a18" x="0" y="374.0" textLength="840.0" lengthAdjust="spacingAndGlyphs">sbx: ./Dockerfile: line 2: RUN apk add --no-cache postgresql16-client: the command returned a non-ze</text><text class="a19" x="0" y="394.0" textLength="84.0" lengthAdjust="spacingAndGlyphs">ro code: 1</text><text class="a20" x="0" y="414.0" textLength="747.6" lengthAdjust="spacingAndGlyphs">blocked: dl-cdn.alpinelinux.org — add --network allow --allow dl-cdn.alpinelinux.org:PORT</text><text class="a21" x="0" y="434.0" textLength="840.0" lengthAdjust="spacingAndGlyphs">the build network is closed (--network none, the default): RUN steps reach only the hosts given with</text><text class="a22" x="0" y="454.0" textLength="285.6" lengthAdjust="spacingAndGlyphs"> --network allow --allow HOST:PORT</text><text class="a23" x="0" y="474.0" textLength="596.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx build -t app --network allow --allow dl-cdn.alpinelinux.org:443 .</text><rect class="t23" x="16.8" y="460.0" width="588.0" height="20" fill="#1d1f27"/><text class="a24" x="0" y="494.0" textLength="184.8" lengthAdjust="spacingAndGlyphs">[1/4] FROM alpine:3.20</text><text class="a25" x="0" y="514.0" textLength="126.0" lengthAdjust="spacingAndGlyphs">[1/4] DONE 0.0s</text><text class="a26" x="0" y="534.0" textLength="403.2" lengthAdjust="spacingAndGlyphs">[2/4] RUN apk add --no-cache postgresql16-client</text><text class="a27" x="0" y="554.0" textLength="126.0" lengthAdjust="spacingAndGlyphs">[2/4] DONE 1.5s</text><text class="a28" x="0" y="574.0" textLength="294.0" lengthAdjust="spacingAndGlyphs">[3/4] ENV PGHOST=db PGUSER=postgres</text><text class="a29" x="0" y="594.0" textLength="126.0" lengthAdjust="spacingAndGlyphs">[3/4] DONE 0.0s</text><text class="a30" x="0" y="614.0" textLength="840.0" lengthAdjust="spacingAndGlyphs">[4/4] CMD until psql -c 'select 1' &gt;/dev/null 2&gt;&amp;1; do sleep 1; done; psql -tAc 'show server_version</text><text class="a31" x="0" y="634.0" textLength="8.4" lengthAdjust="spacingAndGlyphs">'</text><text class="a32" x="0" y="654.0" textLength="126.0" lengthAdjust="spacingAndGlyphs">[4/4] DONE 0.0s</text><text class="a33" x="0" y="674.0" textLength="260.4" lengthAdjust="spacingAndGlyphs">Successfully built 270662e9efeb</text><text class="a34" x="0" y="694.0" textLength="252.0" lengthAdjust="spacingAndGlyphs">Successfully tagged app:latest</text><text class="a35" x="0" y="714.0" textLength="789.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run -d --name db -v pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD=dev postgres:17</text><rect class="t35" x="16.8" y="700.0" width="781.2" height="20" fill="#1d1f27"/><text class="a36" x="0" y="734.0" textLength="294.0" lengthAdjust="spacingAndGlyphs">73cd1868ae15: erofs rootfs prepared</text><text class="a37" x="0" y="754.0" textLength="537.6" lengthAdjust="spacingAndGlyphs">bb4e8b0e63050850ecc1aafad123f3fb8da4bf1637fdb6bbd10205af29c0f169</text><text class="a38" x="0" y="774.0" textLength="453.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx run --rm --connect db:5432 -e PGPASSWORD=dev app</text><rect class="t38" x="16.8" y="760.0" width="445.2" height="20" fill="#1d1f27"/><text class="a39" x="0" y="794.0" textLength="260.4" lengthAdjust="spacingAndGlyphs">17.12 (Debian 17.12-1.pgdg13+1)</text><text class="a40" x="0" y="814.0" textLength="596.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan>sbx rm -f db                              <tspan class="c">  # the volume pgdata stays</tspan></text><rect class="t40" x="16.8" y="800.0" width="588.0" height="20" fill="#1d1f27"/><text class="a41" x="0" y="834.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">db</text><text class="a42" x="0" y="854.0" textLength="16.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan></text>
</g></g></g>
